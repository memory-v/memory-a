backend:
  name: github
  repo: memory-v/memory-v.github.io
  branch: main
  base_url: https://memory-v-oauth.duroy-vic.workers.dev
  auth_endpoint: auth

media_folder: "src/uploads"
public_folder: "/uploads"

publish_mode: simple

collections:
  - name: "posts"
    label: "Memories"
    folder: "src/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: slug
    fields:
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["photo", "video"]
        default: "photo"
      - { label: "Photo", name: "image", widget: "image", required: false, hint: "For photo posts" }
      - { label: "Video", name: "video", widget: "file", required: false, hint: "For video posts (.mp4)" }
      - { label: "Video poster frame", name: "poster", widget: "image", required: false, hint: "Optional still shown before the video plays" }
      - { label: "Caption", name: "body", widget: "markdown", required: false }

  - name: "songs"
    label: "Listening"
    folder: "src/songs"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: title
    fields:
      - { label: "Date added", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Song title", name: "title", widget: "string" }
      - { label: "Artist", name: "artist", widget: "string" }
      - { label: "Release year", name: "year", widget: "number", required: false, value_type: "int" }
      - { label: "Runtime", name: "runtime", widget: "string", required: false, hint: "e.g. 3:45" }
